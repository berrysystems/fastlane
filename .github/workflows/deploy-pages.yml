name: Seite veröffentlichen

# Baut den Inhalt von docs/ und stellt ihn über GitHub Pages bereit.
# Anders als "Deploy from a branch" läuft das über Actions — damit kannst du
# später einen Build-Schritt einschieben, ohne den Ablauf umzustellen.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Nur lesen, plus die beiden Rechte, die Pages selbst braucht.
permissions:
  contents: read
  pages: write
  id-token: write

# Läuft ein Deploy bereits, wird es nicht abgebrochen, sondern der neue
# Lauf wartet. Sonst kann eine halb fertige Version live gehen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Dateien der Seite prüfen
        run: |
          for f in docs/index.html docs/assets/app.css docs/assets/app.js docs/assets/vendor/jszip.min.js; do
            if [ ! -f "$f" ]; then
              echo "$f fehlt — die Seite wäre unvollständig."
              exit 1
            fi
          done

      # Hier später einen Build einschieben, falls docs/ generiert wird:
      # - uses: actions/setup-node@v5
      #   with: { node-version: 22, cache: npm }
      # - run: npm ci && npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
