name: Seite veröffentlichen

# Liefert docs/ auf Cloudflare Pages aus. Dort prüft docs/_worker.js bei
# jeder Anfrage die Anmeldung über Cloudflare Access. Einrichtung: ZUGANG.md

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/deploy/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

# Läuft ein Deploy bereits, wartet der neue Lauf, statt ihn abzubrechen.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

env:
  WRANGLER_VERSION: 4.161.0
  PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'fastlane' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Zugangsdaten für Cloudflare prüfen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Die Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID fehlen. Siehe ZUGANG.md."
            exit 1
          fi

      # Nie einen Türsteher ausliefern, der seine eigenen Tests nicht besteht.
      - name: Zugangsschutz testen
        run: node --test tests/worker/worker.test.mjs

      - name: Konfiguration schreiben
        env:
          # Als Variable oder als Secret angelegt — beides wird gelesen.
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN || secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD || secrets.ACCESS_AUD }}
          SITE_HOST: ${{ vars.SITE_HOST || secrets.SITE_HOST }}
        run: tools/deploy/write-wrangler-config.sh

      - name: Projekt anlegen, falls es noch fehlt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes "wrangler@$WRANGLER_VERSION" pages project list | grep -qw "$PAGES_PROJECT"; then
            echo "Projekt $PAGES_PROJECT ist vorhanden."
          else
            npx --yes "wrangler@$WRANGLER_VERSION" pages project create "$PAGES_PROJECT" --production-branch main
          fi

      - name: Ausliefern
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy docs \
            --project-name "$PAGES_PROJECT" --branch main \
            --commit-hash "$GITHUB_SHA" --commit-dirty=true
